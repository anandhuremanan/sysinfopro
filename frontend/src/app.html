<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
		<script>
			// Apply the saved theme before first paint (kept in sync with src/lib/theme.svelte.ts)
			(function () {
				try {
					var mode = localStorage.getItem('sysinfopro-theme') || 'system';
					var dark =
						mode === 'dark' ||
						(mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
					document.documentElement.classList.toggle('dark', dark);
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" style="widows: 1" class="no-select">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
