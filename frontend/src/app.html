<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
		<script>
			// Apply the saved theme before first paint (kept in sync with src/lib/theme.svelte.ts)
			(function () {
				try {
					var root = document.documentElement;
					var mode = localStorage.getItem('sysinfopro-theme') || 'system';
					var dark =
						mode === 'dark' ||
						mode === 'amoled' ||
						(mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
					root.classList.toggle('dark', dark);
					root.classList.toggle('amoled', mode === 'amoled');
					var vars = JSON.parse(localStorage.getItem('sysinfopro-accent-vars') || 'null');
					if (vars) {
						var v = dark ? vars.dark : vars.light;
						root.style.setProperty('--accent', v.accent);
						root.style.setProperty('--on-accent', v.on);
						root.style.setProperty('--tone-mix', v.on === '#000000' ? '#ffffff' : '#000000');
					}
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" style="widows: 1" class="no-select">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
